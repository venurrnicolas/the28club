<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>THE 28 CLUB · Night Awards</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0b10;color:#f6f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#343541 0,#15151c 42%,#09090d 90%)}main{max-width:560px;margin:auto;padding:22px 16px 90px}.eyebrow{text-align:center;font-size:10px;letter-spacing:3px;color:#b6b7c2}.brand{text-align:center;font-size:clamp(37px,10vw,58px);letter-spacing:-2px;margin:15px 0 0;font-weight:900;background:linear-gradient(115deg,#fff,#9c9ea9,#fff);background-clip:text;color:transparent}.sub{text-align:center;letter-spacing:3px;color:#b8bac4;font-size:11px;margin:5px 0 30px}.card{border:1px solid #494b57;border-radius:22px;padding:22px;background:linear-gradient(145deg,#24252e,#15161d);box-shadow:0 18px 40px #0007;margin:14px 0}.tag{font-size:11px;letter-spacing:2px;color:#b7b9c5;text-transform:uppercase}.muted{color:#b6b8c3;font-size:14px;line-height:1.55}h2{font-size:25px;margin:12px 0}button{cursor:pointer}.btn{width:100%;border:1px solid #c4c5cd;border-radius:12px;background:linear-gradient(110deg,#f7f7f8,#a1a3af);color:#15151a;font-weight:800;font-size:14px;padding:15px;margin-top:10px}.btn.alt{background:#30313c;color:#f5f5f6;border-color:#656673}.btn:disabled{opacity:.45}input,select,textarea{font:inherit;width:100%;padding:13px;margin:8px 0 12px;background:#101116;border:1px solid #686a75;color:#fff;border-radius:10px}textarea{resize:vertical;min-height:95px}label{display:block;font-size:13px;color:#d8d9df}.choice{display:block;text-align:left;width:100%;background:#30313b;color:white;border:1px solid #5b5d69;border-radius:11px;padding:14px;margin:9px 0}.choice.on{background:#565864;border-color:white}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.small{font-size:12px;color:#b4b5c0}.gold{font-size:56px;text-align:center;margin:15px}.winner{text-align:center;font-size:32px;font-weight:900;margin:24px 0;color:#f1f1f3}.line{height:1px;background:#50515a;margin:18px 0}.meter{height:9px;background:#343540;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#777986,#f4f4f6)}.result{margin:15px 0}.circle{width:165px;height:165px;margin:20px auto;border-radius:50%;border:7px solid #bfc1cb;background:conic-gradient(#3d3f49 0 45deg,#7b7d88 45deg 90deg,#242630 90deg 135deg,#b4b5bf 135deg 180deg,#3d3f49 180deg 225deg,#7b7d88 225deg 270deg,#242630 270deg 315deg,#b4b5bf 315deg);display:grid;place-items:center}.circle b{background:#15161d;border:2px solid #fff;border-radius:50%;width:80px;height:80px;display:grid;place-items:center;font-size:29px}.status{text-align:center;color:#aeb0bb;font-size:12px;margin:16px 0}.error{border:1px solid #ba7676;background:#4c282c;padding:12px;border-radius:10px;font-size:13px}.success{border:1px solid #8b9b8e;background:#263a30;padding:12px;border-radius:10px;font-size:13px}.confetti{animation:pop .6s ease-out}@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:scale(1);opacity:1}}.foot{text-align:center;color:#858793;font-size:10px;letter-spacing:1px;margin-top:30px}a{color:#e1e1e7}
</style></head><body><main><div class="eyebrow">✦ PRIVATE BIRTHDAY EXPERIENCE · 28.11.2026</div><div class="brand">THE 28 CLUB</div><div class="sub">NIGHT AWARDS × ROULETTE × AFTER DARK</div><div id="app"></div><div class="foot">BLACK & SILVER EDITION · 28 YEARS</div></main><script>
// CONFIGURA ESTOS DOS VALORES CON LAS CREDENCIALES PÚBLICAS DE SUPABASE.
// NUNCA PEGUES AQUÍ LA CLAVE service_role NI EL PIN DEL ANFITRIÓN.
const SUPABASE_URL='';
const SUPABASE_ANON_KEY='';
const categories=['Mejor outfit masculino','Mejor outfit femenino','Mejor peinado','El más elegante de la noche','El más coqueto/a','El alma de la fiesta','La mejor sonrisa'];
const dilemmas=[['¿Qué es peor?','Que te dejen en visto','Que te respondan solo «jajaja»'],['¿Qué prefieres esta noche?','Conocer a alguien que te encante','Terminar con una anécdota inolvidable'],['¿Qué te daría más vergüenza?','Dar like a una foto de 2018','Enviar un audio coqueto al chat equivocado'],['¿Qué elegirías?','Una cita perfecta sin química','Una cita caótica con mucha química'],['¿Qué prefieres descubrir?','Que alguien aquí tiene un crush contigo','Que tu ex mira tus historias'],['¿Qué es más peligroso en una fiesta?','«Solo me quedo un rato»','«Una última y nos vamos»'],['¿Qué prefieres?','Bailar toda la noche','Conversar hasta el amanecer'],['¿Qué harías?','Escribirle primero a tu crush','Esperar a que te escriba']];
const online=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=(()=>{try{return JSON.parse(localStorage.getItem('club28_user')||'{}')}catch{return {}}})();let me=saved.id? saved:null;let snapshot={state:{phase:'lobby',award_index:0,reveal:false,dilemma_index:0,dilemma_reveal:false,round_no:0},people:[]};let page='home',hostPin='',lastError='',lastOk='',local={people:[],awards:{},dilemmas:{},notes:[],used:[],...(()=>{try{return JSON.parse(localStorage.getItem('club28_demo')||'{}')}catch{return {}}})()};let selected={},currentResult=[],dilemmaResult={};
function store(){localStorage.setItem('club28_demo',JSON.stringify(local))}function notice(t,ok=false){lastError=ok?'':t;lastOk=ok?t:''}function btn(text,action,alt=false){return `<button class="btn ${alt?'alt':''}" data-act="${action}">${text}</button>`}function card(s){return `<div class="card">${s}</div>`}function banner(){return !online?'<div class="status">⚠ DEMO LOCAL · para conectar varios celulares, sigue README.md</div>':'<div class="status">● SALA EN VIVO · actualización cada 3 segundos</div>'}function nav(){return btn('Volver al club','home',true)}
async function rpc(name,args={}){if(!online)throw Error('Demo local');const r=await fetch(`${SUPABASE_URL.replace(/\/$/,'')}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(args)});let data;try{data=await r.json()}catch{data=null}if(!r.ok)throw Error(data?.message||`Error ${r.status}`);return data}
async function refresh(){if(online){snapshot=await rpc('club_snapshot')}else{snapshot.people=local.people.filter(x=>x.eligible);snapshot.state=local.state||snapshot.state}if(page==='awards'&&snapshot.state.reveal){currentResult=online?await rpc('club_award_result',{p_category:snapshot.state.award_index}):localAwardResult(snapshot.state.award_index)}if(page==='roulette'&&snapshot.state.dilemma_reveal){dilemmaResult=online?await rpc('club_dilemma_result',{p_round:snapshot.state.round_no}):localDilemmaResult(snapshot.state.round_no)}render()}
function localAwardResult(i){const m={};for(const [k,v] of Object.entries(local.awards)){if(k.endsWith(':'+i))m[v]=(m[v]||0)+1}return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,votes])=>({name:local.people.find(p=>p.id===id)?.nickname||'Invitado',votes}))}function localDilemmaResult(r){const v=Object.entries(local.dilemmas).filter(([k])=>k.endsWith(':'+r)).map(([,v])=>v);return {A:v.filter(x=>x==='A').length,B:v.filter(x=>x==='B').length}}
function render(){const s=snapshot.state;let h='';if(page==='home')h=card(`<div class="tag">✦ Acceso VIP</div><h2>Una noche para recordar.</h2><p class="muted">Vota en los 7 Night Awards, descubre a los ganadores y participa en la ruleta de dilemas. Al final, deja un mensaje o una confesión realmente anónima.</p>${me?`<p class="success">Tu pase: ${esc(me.nickname)}</p>${btn('ENTRAR AL CLUB','club')}`:btn('CREAR MI PASE VIP','register')}${btn('Panel del anfitrión','hostLogin',true)}${banner()}`);
if(page==='register')h=card(`<div class="tag">01 · Tu pase VIP</div><h2>¿Cómo te llamamos?</h2><label>Nombre o apodo</label><input id="nick" maxlength="35" placeholder="Tu apodo"><label>Categoría de outfit (opcional)</label><select id="outfit"><option value="">No participar en outfit</option><option value="masculino">Outfit masculino</option><option value="femenino">Outfit femenino</option></select><label><input id="eligible" type="checkbox" checked style="width:auto"> Acepto aparecer como candidato/a en los premios</label>${btn('ENTRAR','join')}${nav()}`);
if(page==='club')h=card(`<div class="tag">✦ Pase VIP</div><h2>Hola, ${esc(me?.nickname||'invitado/a')}.</h2><p class="muted">Etapa actual: <b>${({lobby:'Sala de espera',vote:'Votaciones abiertas',awards:'Ceremonia de premios',roulette:'Ruleta de dilemas',after:'After Dark',closed:'Cierre'})[s.phase]}</b></p>${btn('🏆 NIGHT AWARDS','vote')}${btn('🎰 RULETA DE DILEMAS','roulette',true)}${btn('💌 AFTER DARK','after',true)}${btn('VER CEREMONIA','awards',true)}${banner()}`);
if(page==='vote'){const i=Number(document.getElementById('catIndex')?.value??window.catIndex??0);window.catIndex=i;const eligible=snapshot.people.filter(p=>p.id!==me?.id&&(i===0?p.outfit==='masculino':i===1?p.outfit==='femenino':true));h=card(`<div class="tag">NIGHT AWARDS · ${i+1}/7</div><h2>${esc(categories[i])}</h2><p class="muted">Un voto por categoría. Puedes cambiarlo mientras la votación esté abierta.</p>${s.phase!=='vote'?'<p class="small">🔒 El anfitrión todavía no abre las votaciones o ya las cerró.</p>':`<input id="search" placeholder="Buscar candidato"><div id="candidates">${eligible.map(p=>`<button class="choice ${selected[i]===p.id?'on':''}" data-nominee="${p.id}">${esc(p.nickname)} ${selected[i]===p.id?'✓':''}</button>`).join('')||'<p class="muted">Todavía no hay candidatos.</p>'}</div>${btn('GUARDAR VOTO','saveVote')}`}<div class="row">${btn('← Anterior','prevCat',true)}${btn('Siguiente →','nextCat',true)}</div>${nav()}`)}
if(page==='awards'){const i=s.award_index;h=card(`<div class="tag">NIGHT AWARDS · PREMIACIÓN ${i+1}/7</div><div class="gold">🏆</div><h2 style="text-align:center">${esc(categories[i])}</h2>${s.phase!=='awards'?'<p class="muted" style="text-align:center">La ceremonia todavía no comienza.</p>':s.reveal?`<div class="confetti"><div class="winner">${esc(currentResult[0]?.name||'Sin votos')}</div><p class="muted" style="text-align:center">${currentResult[0]?`${currentResult[0].votes} voto(s) · ¡Felicidades!`:'No hubo votos en esta categoría.'}</p>${currentResult.slice(1).map((x,j)=>`<p class="small">${j+2}º ${esc(x.name)} · ${x.votes} voto(s)</p>`).join('')}</div>`:'<p class="winner">¿QUIÉN GANARÁ?</p><p class="muted" style="text-align:center">Esperando revelación del anfitrión...</p>'}${nav()}`)}
if(page==='roulette'){const d=dilemmas[s.dilemma_index],round=s.round_no,a=selected['d'+round],total=(dilemmaResult.A||0)+(dilemmaResult.B||0);h=card(`<div class="tag">THE 28 ROULETTE · GIRO ${round}</div><div class="circle"><b>28</b></div>${s.phase!=='roulette'||round===0?'<h2 style="text-align:center">Esperando el próximo giro...</h2>':`<h2 style="text-align:center">${esc(d[0])}</h2>${[['A',d[1]],['B',d[2]]].map(([k,t])=>`<button class="choice ${a===k?'on':''}" data-answer="${k}" ${s.dilemma_reveal?'disabled':''}>${k} · ${esc(t)}</button>`).join('')}${s.dilemma_reveal?`<div class="line"></div>${[['A',d[1]],['B',d[2]]].map(([k,t])=>`<div class="result"><div class="small">${k} · ${esc(t)} — ${total?Math.round((dilemmaResult[k]||0)*100/total):0}%</div><div class="meter"><span style="width:${total?(dilemmaResult[k]||0)*100/total:0}%"></span></div></div>`).join('')}`:`<p class="small">${a?'✓ Voto registrado':'Elige A o B para votar.'}</p>`}`}${nav()}`)}
if(page==='after')h=card(`<div class="tag">Final chapter · AFTER DARK</div><h2>Lo que se escribe aquí, queda en el misterio.</h2><p class="muted">💌 Déjale un mensaje a Nicolás, una confesión de la noche o ambas cosas. Ninguna respuesta se vincula a tu pase VIP ni guarda tu nombre. Ni los demás invitados ni Nicolás podrán saber quién la escribió.</p><label>💌 Un mensaje para Nicolás (opcional)</label><textarea id="message" maxlength="400" placeholder="Un recuerdo, una dedicatoria..."></textarea><label>🔥 Una confesión corta (opcional)</label><textarea id="confession" maxlength="400" placeholder="Algo divertido, atrevido o inesperado..."></textarea><p class="small">No escribas datos que te identifiquen si deseas mantener el anonimato. El servicio de alojamiento puede conservar registros técnicos de acceso.</p>${s.phase==='after'||s.phase==='closed'?btn('ENVIAR ANÓNIMAMENTE','sendNotes'):'<p class="small">🔒 Se habilita al finalizar los juegos.</p>'}${nav()}`);
if(page==='hostLogin')h=card(`<div class="tag">Acceso anfitrión</div><h2>Panel privado</h2>${online?'<label>PIN de anfitrión</label><input id="pin" type="password" placeholder="PIN privado" autocomplete="off">':'<p class="muted">En modo demo puedes probar el panel sin PIN. En línea el PIN se comprueba en el servidor.</p>'}${btn('ABRIR PANEL','hostEnter')}${nav()}`);
if(page==='host')h=card(`<div class="tag">HOST CONTROL</div><h2>THE 28 CLUB</h2><p class="muted">Fase: ${esc(s.phase)} · ${snapshot.people.length} candidatos inscritos</p>${btn('ABRIR VOTACIONES','host_vote')}${btn('INICIAR PREMIACIÓN','host_awards')}${s.phase==='awards'?`${btn('REVELAR GANADOR','host_award_reveal')}${btn('SIGUIENTE PREMIO','host_next_award')}`:''}${btn('INICIAR RULETA','host_roulette')}${s.phase==='roulette'?`${btn('GIRAR NUEVO DILEMA','host_spin')}${btn('MOSTRAR PORCENTAJES','host_dilemma_reveal')}`:''}${btn('ABRIR AFTER DARK','host_after')}${btn('LEER MENSAJES ANÓNIMOS','readNotes',true)}${btn('CERRAR EVENTO','host_closed',true)}${btn('Salir del panel','hostLogout',true)}`);
if(page==='notes')h=card(`<div class="tag">Panel anfitrión · After Dark</div><h2>Mensajes y confesiones</h2>${(window.notes||[]).map(x=>`<div class="line"></div><p class="small">${x.kind==='mensaje'?'💌 Mensaje':'🔥 Confesión'}</p><p>${esc(x.body)}</p>`).join('')||'<p class="muted">Aún no hay mensajes.</p>'}${btn('Volver al panel','hostPage')}`);
app.innerHTML=(lastError?`<div class="error">${esc(lastError)}</div>`:'')+(lastOk?`<div class="success">${esc(lastOk)}</div>`:'')+h;lastError='';lastOk='';const sr=document.getElementById('search');if(sr)sr.oninput=()=>{document.querySelectorAll('[data-nominee]').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(sr.value.toLowerCase())?'':'none')};}
async function host(action,value=0){if(online){await rpc('club_host',{p_pin:hostPin,p_action:action,p_value:value})}else{let s=local.state||(local.state={...snapshot.state});if(['lobby','vote','awards','roulette','after','closed'].includes(action))s.phase=action;if(action==='awards'){s.award_index=0;s.reveal=false}if(action==='award_index'){s.award_index=value;s.reveal=false}if(action==='award_reveal')s.reveal=true;if(action==='spin'){s.phase='roulette';s.dilemma_index=value;s.dilemma_reveal=false;s.round_no++}if(action==='dilemma_reveal')s.dilemma_reveal=true;store()}await refresh()}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act],[data-nominee],[data-answer]');if(!b)return;const action=b.dataset.act;try{if(b.dataset.nominee){selected[window.catIndex||0]=b.dataset.nominee;render();return}if(b.dataset.answer){if(snapshot.state.dilemma_reveal)return;const v=b.dataset.answer,round=snapshot.state.round_no;await (online?rpc('club_vote_dilemma',{p_voter:me.id,p_round:round,p_answer:v}):(async()=>{local.dilemmas[me.id+':'+round]=v;store()})());selected['d'+round]=v;notice('Tu voto quedó registrado.',true);render();return}if(action==='register'){page='register';render();return}if(action==='join'){const name=document.getElementById('nick').value.trim(),outfit=document.getElementById('outfit').value||null,eligible=document.getElementById('eligible').checked;if(name.length<2)throw Error('Escribe un apodo de al menos dos caracteres.');const id=online?await rpc('club_join',{p_name:name,p_outfit:outfit,p_eligible:eligible}):crypto.randomUUID();if(!online){if(local.people.some(p=>p.nickname.toLowerCase()===name.toLowerCase()))throw Error('Ese apodo ya está en uso.');local.people.push({id,nickname:name,outfit,eligible});store()}me={id,nickname:name};localStorage.setItem('club28_user',JSON.stringify(me));page='club';await refresh();return}if(['home','club','vote','roulette','awards','after','hostLogin'].includes(action)){if(action!=='home'&&action!=='hostLogin'&&!me)throw Error('Primero crea tu pase VIP.');page=action;await refresh();return}if(action==='prevCat'||action==='nextCat'){window.catIndex=Math.max(0,Math.min(6,(window.catIndex||0)+(action==='nextCat'?1:-1)));render();return}if(action==='saveVote'){const i=window.catIndex||0,v=selected[i];if(!v)throw Error('Elige un candidato o continúa sin votar.');await (online?rpc('club_vote_award',{p_voter:me.id,p_category:i,p_nominee:v}):(async()=>{local.awards[me.id+':'+i]=v;store()})());notice('Voto guardado.',true);window.catIndex=Math.min(i+1,6);render();return}if(action==='sendNotes'){const message=document.getElementById('message').value.trim(),confession=document.getElementById('confession').value.trim();if(!message&&!confession)throw Error('Escribe un mensaje o una confesión.');if(online){if(message)await rpc('club_send_note',{p_kind:'mensaje',p_body:message});if(confession)await rpc('club_send_note',{p_kind:'confesion',p_body:confession})}else{if(message)local.notes.push({kind:'mensaje',body:message});if(confession)local.notes.push({kind:'confesion',body:confession});store()}notice('Enviado de forma anónima. ¡Gracias!',true);render();return}if(action==='hostEnter'){hostPin=online?document.getElementById('pin').value:'';if(online)await rpc('club_host',{p_pin:hostPin,p_action:'verify',p_value:0});page='host';await refresh();return}if(action==='hostLogout'){hostPin='';page='home';render();return}if(action==='hostPage'){page='host';render();return}if(action?.startsWith('host_')){const a=action.slice(5);if(a==='next_award')await host('award_index',Math.min(snapshot.state.award_index+1,6));else if(a==='spin'){const used=local.used||[];let pool=dilemmas.map((_,i)=>i).filter(i=>!used.includes(i));if(!pool.length){pool=dilemmas.map((_,i)=>i);local.used=[]}const pick=pool[Math.floor(Math.random()*pool.length)];local.used.push(pick);store();await host('spin',pick)}else await host(a);render();return}if(action==='readNotes'){window.notes=online?await rpc('club_host_notes',{p_pin:hostPin}):local.notes;page='notes';render();return}}catch(err){notice(err.message||'No se pudo completar la acción');render()}});
(async()=>{try{await refresh()}catch(e){notice('No se pudo conectar: '+e.message);render()}})();setInterval(async()=>{if(!online)return;try{await refresh()}catch(e){/* se mostrará al reintentar manualmente */}},3000);
</script></body></html>
